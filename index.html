<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honor of Kings - تور دۇكىنى</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding-bottom: 70px;
        }
        /* يۇقىرىقى قىسىم (Header) */
        .header {
            background-color: #00b074;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header .title {
            font-size: 18px;
            font-weight: bold;
        }
        .balance-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        /* ئىزدەش قىسمى */
        .search-container {
            padding: 15px;
            background-color: white;
            text-align: right;
        }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background-color: #f7f7f7;
            text-align: right;
            outline: none;
            font-size: 14px;
        }
        .game-title {
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        /* مەھسۇلات تور كاتەكچىسى (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card img {
            width: 100%;
            border-radius: 50%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 3px solid #00b074;
        }
        .card .item-name {
            font-size: 12px;
            color: #00b074;
            margin-top: 8px;
            font-weight: bold;
        }
        .card .item-price {
            font-size: 13px;
            color: #333;
            margin-top: 4px;
            font-weight: bold;
        }
        /* تۆۋەنقى مىنيۇ (Footer Menu) */
        .footer-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }
        .footer-item {
            text-align: center;
            font-size: 20px;
            color: #666;
            text-decoration: none;
        }
        .footer-item.active {
            color: #00b074;
        }
    </style>
</head>
<body>

    <!-- يۇقىرىقىە باش قىسمى -->
    <div class="header">
        <div class="title">← O</div>
        <div class="balance-box">3,043.05 ل.س +</div>
        <div>☰</div>
    </div>

    <!-- ئىزدەش رامكىسى -->
    <div class="search-container">
        <input type="text" class="search-box" placeholder="بەھس (ئىزدەش)...">
    </div>

    <div class="game-title">Honor of king</div>

    <!-- مەھسۇلاتلار تىزىملىكى (رەسىم، مىقدار ۋە باھا ئۆزگەرمەس قىسمى) -->
    <div class="grid-container">
        <!-- 1 -->
        <div class="card">
            <img src="https://i.imgur.com/32G5Q7o.png" alt="Honor">
            <div class="item-name">Tokens Honor 240</div>

        </div>
        <!-- 2 -->

        </div>
        <!-- 3 -->
        <div class="card">

            <div class="item-name">Tokens Honor 16</div>
            <div class="item-price">$ 0.1851</div>
        </div>
        <!-- 4 -->

            <div class="item-name">Tokens Honor 830</div>
            <div class="item-price">$ 9.13</div>
        </div>
        <!-- 5 -->
        <div class="card">

            <div class="item-name">Tokens Honor 560</div>

        <!-- 6 -->

        <!-- 7 -->

        </div>
        <!-- 8 -->

            <div class="item-name">Tokens Honor 2580</div>

    </div>

    <!-- تۆۋەنقى كۆچمە تېلېفون مىنيۇسى -->

        <a href="#" class="footer-item">🛡️</a>

</body>
</html>
