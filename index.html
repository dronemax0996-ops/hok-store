<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پۇل قاچىلاش - Add Funds</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 20px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--sub-text);
            font-size: 13px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .info-box {
            background: rgba(56, 189, 248, 0.05);
            border: 1px dashed var(--accent-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .info-box strong {
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            font-size: 12px;
            color: var(--sub-text);
            margin-bottom: 5px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 11px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .amount-btn.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            text-align: center;
            color: var(--sub-text);
            font-size: 13px;
            text-decoration: none;
            margin-top: 15px;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💳 ھېساباتقا پۇل تولدۇرۇش</h1>
        <p>Add Funds to Your Account</p>
    </header>

    <!-- پۇل ئۆتكۈزۈش ئۇچۇرى كۆرسىتىش ئورنى -->
    <div class="card">
        <div class="section-title">📌 پۇل تۆلەش ئۇسۇلى</div>
        <div class="info-box">
            تۆۋەندىكى <strong>ShamCash</strong> ھېساباتىمىزغا پۇل ئۆتكۈزگەندىن كېيىن، تۆۋەندىكى شەكىلنى تولدۇرۇپ ئەۋەتىڭ.<br>
            👤 <strong>ھېسابات ئىسمى: N. Muhsin</strong><br>
            🔢 <strong>ShamCash نومۇرى:</strong> (بۇ يەرگە نومۇرىڭىزنى يازىسىز)
        </div>
    </div>

    <!-- پۇل قاچىلاش فورمىسى -->
    <div class="card">
        <div class="section-title">✍️ پۇل تەپسىلاتىنى كىرگۈزۈش</div>
        
        <div class="form-group">
            <label class="form-label">سومما تاللاڭ ($)</label>
            <div class="amount-grid">
                <button type="button" class="amount-btn active" onclick="setAmount(5)">$5</button>
                <button type="button" class="amount-btn" onclick="setAmount(10)">$10</button>
                <button type="button" class="amount-btn" onclick="setAmount(20)">$20</button>
                <button type="button" class="amount-btn" onclick="setAmount(50)">$50</button>
                <button type="button" class="amount-btn" onclick="setAmount(100)">$100</button>
                <button type="button" class="amount-btn" onclick="setAmount('custom')">باشقا</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">قىممىتى ($)</label>
            <input type="number" id="custom-amount" class="form-control" value="5" placeholder="قىممىتىنى كىرگۈزۈڭ">
        </div>

        <div class="form-group">
            <label class="form-label">ھېسابات ئىسمى ياكى UID</label>
            <input type="text" class="form-control" placeholder="ئىسمىڭىز ياكى ID نى يېزىڭ">
        </div>

        <div class="form-group">
            <label class="form-label">پۇل ئۆتكۈزۈش ئىسپات كودى (Ref ID / ترانسאַكسىيە نومۇرى)</label>
            <input type="text" class="form-control" placeholder="مەسىلەن: #TRX12345678">
        </div>

        <button class="btn" onclick="submitFunds()">پۇل قاچىلاش تەلىپى ئەۋەتىش</button>
    </div>

    <a href="index.html" class="back-link">← باش بەتكە قايتىش</a>

</div>

<script>
    function setAmount(val) {
        document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        const input = document.getElementById('custom-amount');
        if(val !== 'custom') {
            input.value = val;
            input.disabled = false;
        } else {
            input.value = '';
            input.focus();
        }
    }

    function submitFunds() {
        alert('پۇل تولدۇرۇش تەلىپىڭىز قوبۇل قىلىندى! تەكشۈرۈلگەندىن كېيىن ھېساباتىڭىزغا قوشۇلىدۇ.');
    }
</script>

</body>
</html>
