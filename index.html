<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Othman Store - Game Recharge</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #131c31;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-circle {
            width: 38px;
            height: 38px;
            background: var(--accent-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 18px;
        }

        .balance-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--accent-green);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .balance-badge span {
            color: var(--accent-green);
            font-size: 13px;
            font-weight: bold;
        }

        .add-btn {
            background: var(--accent-green);
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Banner Slider Style */
        .banner {
            margin: 15px;
            background: linear-gradient(135deg, #052e16, #064e3b);
            border: 1px solid #047857;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .banner h2 {
            color: #4ade80;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .banner p {
            color: #d1d5db;
            font-size: 12px;
        }

        /* Search Box */
        .search-box {
            padding: 0 15px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-green);
        }

        /* Categories Grid */
        .section-title {
            padding: 0 15px;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #e2e8f0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .category-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .card-icon-box {
            width: 100%;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: var(--sub-text);
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-item span {
            font-size: 18px;
        }

        /* Views management */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        .game-detail-section {
            padding: 15px;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="logo-area">
            <div class="logo-circle">S</div>
            <span style="font-weight: bold; font-size: 15px;">OTHMAN STORE</span>
        </div>
        <div class="balance-badge">
            <a href="#" class="add-btn">+</a>
            <span id="user-balance">809.91 ل.س</span>
        </div>
    </div>

    <!-- === باش بەت (Home View) === -->
    <div id="home-view" class="view active">
        <!-- Banner -->
        <div class="banner">
            <h2>يتوفر الدعم !!</h2>
            <p>على مدار اليوم للرد على جميع الاستفسارات</p>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" class="search-input" placeholder="بحث (ئىزدەش)...">
        </div>

        <div class="section-title">الأقسام الرئيسية (بۆلەكلەر)</div>

        <!-- Categories Grid -->
        <div class="grid-container">
            <!-- 1. Honor of Kings -->
            <div class="category-card" onclick="openGame('hok')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/5gRdRdM2/hok.jpg" alt="Honor of Kings">
                </div>
                <div class="card-name">Honor of Kings</div>
            </div>
            <!-- 2. Mobile Legends -->
            <div class="category-card" onclick="openGame('mlbb')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/Xf3dg16D/mlbb.jpg" alt="Mobile Legends">
                </div>
                <div class="card-name">Mobile Legends</div>
            </div>
            <!-- 3. PUBG Mobile -->
            <div class="category-card" onclick="openGame('pubg')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/zVJv5yCR/pubg.jpg" alt="PUBG Mobile">
                </div>
                <div class="card-name">PUBG Mobile</div>
            </div>
            <!-- 4. Arena Breakout -->
            <div class="category-card" onclick="openGame('ab')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/xKrJ21XB/arena.jpg" alt="Arena Breakout">
                </div>
                <div class="card-name">Arena Breakout</div>
            </div>
            <!-- Extra Category 5 -->
            <div class="category-card" onclick="alert('تىزلا ئېچىلىدۇ!')">
                <div class="card-icon-box" style="font-size: 24px;">💎</div>
                <div class="card-name">قسم الارصدة</div>
            </div>
            <!-- Extra Category 6 -->
            <div class="category-card" onclick="alert('تىزلا ئېچىلىدۇ!')">
                <div class="card-icon-box" style="font-size: 24px;">💳</div>
                <div class="card-name">قسم البطاقات</div>
            </div>
        </div>
    </div>

    <!-- === ئويۇن تەپسىلات ۋە قاچىلاش بېتى === -->
    <div id="game-view" class="view">
        <div class="game-detail-section">
            <button class="back-btn" onclick="goHome()">← ئارقىغا قايتىش</button>
            <div id="game-content-box" style="background: var(--card-bg); padding: 15px; border-radius: 14px; border: 1px solid var(--border-color);">
                <!-- динамик ئويۇن ئۇچۇرلىرى بۇ يەرگە چىقىدۇ -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goHome()">
            <span>🏠</span>
            باش بەت
        </a>
        <a href="#" class="nav-item" onclick="alert('پۇل قاچىلاش بەتچىسى')">
            <span>💳</span>
            پۇل قاچىلاش
        </a>
        <a href="#" class="nav-item" onclick="alert('تارىخچە')">
            <span>🔄</span>
            تارىخ
        </a>
        <a href="#" class="nav-item" onclick="alert('سەۋەت')">
            <span>🛒</span>
            سەۋەت
        </a>
        <a href="#" class="nav-item" onclick="alert('مەخپىيەتلىك / تەڭشەك')">
            <span>🛡️</span>
            ھېسابات
        </a>
    </div>

</div>

<script>
    function openGame(gameKey) {
        document.getElementById('home-view').classList.remove('active');
        document.getElementById('game-view').classList.add('active');
        
        const box = document.getElementById('game-content-box');
        if(gameKey === 'hok') {
            box.innerHTML = `<h3>👑 Honor of Kings</h3><p style="color:var(--sub-text); margin: 10px 0; font-size:13px;">UID نى كىرگۈزۈپ تاللانما تاللاڭ</p><input type="text" class="search-input" placeholder="Player ID (UID)" style="margin-bottom:10px;"><button class="add-btn" style="width:100%; height:40px; border-radius:8px; border:none; background:var(--accent-green); color:#fff; font-weight:bold;">زاكاز قىلىش</button>`;
        } else if(gameKey === 'mlbb') {
            box.innerHTML = `<h3>⚔️ Mobile Legends Bang Bang</h3><p style="color:var(--sub-text); margin: 10px 0; font-size:13px;">ID & Zone نى كىرگۈزۈڭ</p><input type="text" class="search-input" placeholder="ID & Zone ID" style="margin-bottom:10px;"><button class="add-btn" style="width:100%; height:40px; border-radius:8px; border:none; background:var(--accent-green); color:#fff; font-weight:bold;">زاكاز قىلىش</button>`;
        } else if(gameKey === 'pubg') {
            box.innerHTML = `<h3>🎯 PUBG Mobile</h3><p style="color:var(--sub-text); margin: 10px 0; font-size:13px;">UID نى كىرگۈزۈڭ</p><input type="text" class="search-input" placeholder="Player ID (UID)" style="margin-bottom:10px;"><button class="add-btn" style="width:100%; height:40px; border-radius:8px; border:none; background:var(--accent-green); color:#fff; font-weight:bold;">زاكاز قىلىش</button>`;
        } else if(gameKey === 'ab') {
            box.innerHTML = `<h3>🛡️ Arena Breakout</h3><p style="color:var(--sub-text); margin: 10px 0; font-size:13px;">UID نى كىرگۈزۈڭ</p><input type="text" class="search-input" placeholder="Player ID (UID)" style="margin-bottom:10px;"><button class="add-btn" style="width:100%; height:40px; border-radius:8px; border:none; background:var(--accent-green); color:#fff; font-weight:bold;">زاكاز قىلىش</button>`;
        }
        window.scrollTo(0,0);
    }

    function goHome() {
        document.getElementById('game-view').classList.remove('active');
        document.getElementById('home-view').classList.add('active');
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
