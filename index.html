<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئاپتوماتىك پۇل قاچىلاش مۇلازىمىتى</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #131c31;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-circle {
            width: 32px;
            height: 32px;
            background: var(--accent-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }

        .balance-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--accent-green);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .balance-badge span {
            color: var(--accent-green);
            font-size: 13px;
            font-weight: bold;
        }

        .add-btn {
            background: var(--accent-green);
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Banner Style */
        .banner {
            margin: 15px;
            background: linear-gradient(135deg, #052e16, #064e3b);
            border: 1px solid #047857;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .banner h2 {
            color: #4ade80;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .banner p {
            color: #d1d5db;
            font-size: 12px;
        }

        /* Search Box */
        .search-box {
            padding: 0 15px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-green);
        }

        /* Categories Grid */
        .section-title {
            padding: 0 15px;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #e2e8f0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .category-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .card-icon-box {
            width: 100%;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: var(--sub-text);
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-item span:first-child {
            font-size: 18px;
        }

        /* Views management */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        .game-detail-section {
            padding: 15px;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Price List Styles */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .price-item span:last-child {
            color: var(--accent-green);
            font-weight: bold;
        }

        .category-header {
            font-size: 12px;
            color: var(--sub-text);
            margin-top: 10px;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 3px;
        }

        .order-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }

        .order-box h4 {
            font-size: 13px;
            color: var(--sub-text);
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="logo-area">
            <div class="logo-circle">S</div>
            <span style="font-weight: bold; font-size: 13px;">ئاپتوماتىك پۇل قاچىلاش مۇلازىمىتى</span>
        </div>
        <div class="balance-badge">
            <a href="#" class="add-btn">+</a>
            <span id="user-balance">809.91 ل.س</span>
        </div>
    </div>

    <!-- === باش بەت (Home View) === -->
    <div id="home-view" class="view active">
        <!-- Banner -->
        <div class="banner">
            <h2>ياردەم مۇلازىمىتى تەييار !!</h2>
            <p>بارلىق سوئاللىرىڭىزغا كۈندۈز-تۈنى جاۋاب بېرىمىز</p>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" class="search-input" placeholder="ئىزدەش...">
        </div>

        <div class="section-title">ئاساسلىق بۆلەكلەر</div>

        <!-- Categories Grid -->
        <div class="grid-container">
            <!-- 1. PUBG Mobile -->
            <div class="category-card" onclick="openGame('pubg')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/zVJv5yCR/pubg.jpg" alt="PUBG Mobile">
                </div>
                <div class="card-name">PUBG Mobile</div>
            </div>
            <!-- 2. Mobile Legends -->
            <div class="category-card" onclick="openGame('mlbb')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/Xf3dg16D/mlbb.jpg" alt="Mobile Legends">
                </div>
                <div class="card-name">Mobile Legends</div>
            </div>
            <!-- 3. Honor of Kings -->
            <div class="category-card" onclick="openGame('hok')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/5gRdRdM2/hok.jpg" alt="Honor of Kings">
                </div>
                <div class="card-name">Honor of Kings</div>
            </div>
            <!-- 4. Cards -->
            <div class="category-card" onclick="alert('تىزلا ئېچىلىدۇ!')">
                <div class="card-icon-box" style="font-size: 24px;">💳</div>
                <div class="card-name">پراكتىك كارتا بۆلىكى</div>
            </div>
            <!-- 5. Balance -->
            <div class="category-card" onclick="alert('تىزلا ئېچىلىدۇ!')">
                <div class="card-icon-box" style="font-size: 24px;">💎</div>
                <div class="card-name">قالدۇق بۆلىكى</div>
            </div>
            <!-- 6. Arena Breakout -->
            <div class="category-card" onclick="openGame('ab')">
                <div class="card-icon-box">
                    <img src="https://i.ibb.co/xKrJ21XB/arena.jpg" alt="Arena Breakout">
                </div>
                <div class="card-name">Arena Breakout</div>
            </div>
        </div>
    </div>

    <!-- === ئويۇن تەپسىلات ۋە باھا جەدۋىلى بېتى === -->
    <div id="game-view" class="view">
        <div class="game-detail-section">
            <button class="back-btn" onclick="goHome()">← ئارقىغا قايتىش</button>
            <div id="game-content-box" style="background: var(--card-bg); padding: 15px; border-radius: 14px; border: 1px solid var(--border-color);">
                <!-- динамиك جەدۋەل بۇ يەرگە چىقىدۇ -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="goHome()">
            <span>🏠</span>
            باش بەت
        </a>
        <a class="nav-item" onclick="alert('پۇل قاچىلاش سەھىپىسى')">
            <span>💳</span>
            پۇل قاچىلاش
        </a>
        <a class="nav-item" onclick="alert('تارىخچە بۆلىكى')">
            <span>🔄</span>
            تارىخ
        </a>
        <a class="nav-item" onclick="alert('سەۋەت بۆلىكى')">
            <span>🛒</span>
            سەۋەت
        </a>
        <a class="nav-item" onclick="alert('ھېسابات تەڭشىكى')">
            <span>🛡️</span>
            ھېسابات
        </a>
    </div>

</div>

<script>
    function openGame(gameKey) {
        document.getElementById('home-view').classList.remove('active');
        document.getElementById('game-view').classList.add('active');
        
        const box = document.getElementById('game-content-box');
        
        if(gameKey === 'hok') {
            box.innerHTML = `
                <h3 style="color:var(--accent-green); margin-bottom:12px;">👑 Honor of Kings باھا جەدۋىلى</h3>
                <div class="price-list">
                    <div class="price-item"><span>16 Token</span> <span>$0.2</span></div>
                    <div class="price-item"><span>80 Token</span> <span>$0.95</span></div>
                    <div class="price-item"><span>240 Token</span> <span>$2.8</span></div>
                    <div class="price-item"><span>400 Token</span> <span>$4.6</span></div>
                    <div class="category-header">✨ ئالاھىدە تەڭلەر:</div>
                    <div class="price-item"><span>Weekly Card Plus</span> <span>$3.5</span></div>
                </div>
                <div class="order-box">
                    <h4>🛒 زاكاز بېرىش</h4>
                    <div class="form-group"><input type="text" class="search-input" placeholder="Player ID (UID) نى يېزىڭ"></div>
                    <div class="form-group"><input type="text" class="search-input" placeholder="پۇل ئۆتكۈزۈش ئىسپات كودى (Ref ID)"></div>
                    <button class="btn-submit" onclick="alert('زاكاز قوبۇل قىلىندى!')">زاكاز ئەۋەتىش</button>
                </div>`;
        } else if(gameKey === 'mlbb') {
            box.innerHTML = `
                <h3 style="color:var(--accent-green); margin-bottom:12px;">⚔️ Mobile Legends باھا جەدۋىلى</h3>
                <div class="price-list">
                    <div class="price-item"><span>78 + 8 Diamonds</span> <span>$1.3</span></div>
                    <div class="price-item"><span>156 + 16 Diamonds</span> <span>$2.6</span></div>
                    <div class="price-item"><span>625 + 81 Diamonds</span> <span>$10.5</span></div>
                    <div class="category-header">✨ ئالاھىدە تەڭلەر:</div>
                    <div class="price-item"><span>Weekly Diamond Pass</span> <span>$1.8</span></div>
                </div>
                <div class="order-box">
                    <h4>🛒 زاكاز بېرىش</h4>
                    <div class="form-group"><input type="text" class="search-input" placeholder="Player ID & Zone ID يېزىڭ"></div>
                    <div class="form-group"><input type="text" class="search-input" placeholder="پۇل ئۆتكۈزۈش ئىسپات كودى (Ref ID)"></div>
                    <button class="btn-submit" onclick="alert('زاكاز قوبۇل قىلىندى!')">زاكاز ئەۋەتىش</button>
                </div>`;
        } else if(gameKey === 'pubg') {
            box.innerHTML = `
                <h3 style="color:var(--accent-green); margin-bottom:12px;">🎯 PUBG Mobile باھا جەدۋىلى</h3>
                <div class="price-list">
                    <div class="price-item"><span>60 UC</span> <span>$0.95</span></div>
                    <div class="price-item"><span>325 UC</span> <span>$4.7</span></div>
                    <div class="price-item"><span>660 UC</span> <span>$9.4</span></div>
                    <div class="price-item"><span>1800 UC</span> <span>$24.5</span></div>
                </div>
                <div class="order-box">
                    <h4>🛒 زاكاز بېرىش</h4>
                    <div class="form-group"><input type="text" class="search-input" placeholder="Player ID (UID) نى يېزىڭ"></div>
                    <div class="form-group"><input type="text" class="search-input" placeholder="پۇل ئۆتكۈزۈش ئىسپات كودى (Ref ID)"></div>
                    <button class="btn-submit" onclick="alert('زاكاز قوبۇل قىلىندى!')">زاكاز ئەۋەتىش</button>
                </div>`;
        } else if(gameKey === 'ab') {
            box.innerHTML = `
                <h3 style="color:var(--accent-green); margin-bottom:12px;">🛡️ Arena Breakout باھا جەدۋىلى</h3>
                <div class="price-list">
                    <div class="price-item"><span>66 Bonds</span> <span>$0.9</span></div>
                    <div class="price-item"><span>335 Bonds</span> <span>$4.5</span></div>
                    <div class="price-item"><span>675 Bonds</span> <span>$8.5</span></div>
                </div>
                <div class="order-box">
                    <h4>🛒 زاكاز بېرىش</h4>
                    <div class="form-group"><input type="text" class="search-input" placeholder="Player ID (UID) نى يېزىڭ"></div>
                    <div class="form-group"><input type="text" class="search-input" placeholder="پۇل ئۆتكۈزۈش ئىسپات كودى (Ref ID)"></div>
                    <button class="btn-submit" onclick="alert('زاكاز قوبۇل قىلىندى!')">زاكاز ئەۋەتىش</button>
                </div>`;
        }
        window.scrollTo(0,0);
    }

    function goHome() {
        document.getElementById('game-view').classList.remove('active');
        document.getElementById('home-view').classList.add('active');
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
