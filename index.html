<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كىنوخانى - سىنلار مەركىزى</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-red: #ff0000;
            --text-color: #ffffff;
            --sub-text: #aaa;
            --border-color: #303030;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 70px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #212121;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-circle {
            width: 32px;
            height: 32px;
            background: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }

        .logo-text {
            font-weight: bold;
            font-size: 15px;
            color: #fff;
        }

        /* Search Box */
        .search-box {
            padding: 12px 15px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: #3ea6ff;
        }

        /* Video List Grid */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 15px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .video-card:hover {
            border-color: #555;
        }

        .thumbnail-box {
            width: 100%;
            height: 200px;
            background: #000;
            position: relative;
        }

        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .video-meta {
            font-size: 12px;
            color: var(--sub-text);
            display: flex;
            gap: 10px;
        }

        /* Player View */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        .player-section {
            padding: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #3ea6ff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .current-video-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .current-video-desc {
            font-size: 13px;
            color: var(--sub-text);
            line-height: 1.5;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #212121;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            text-align: center;
            color: var(--sub-text);
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item span:first-child {
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="logo-area">
            <div class="logo-circle">▶</div>
            <span class="logo-text">كىنوخانى</span>
        </div>
    </div>

    <!-- === باش بەت (Home View) === -->
    <div id="home-view" class="view active">
        <!-- Search -->
        <div class="search-box">
            <input type="text" class="search-input" placeholder="كىنو ئىزدەش...">
        </div>

        <!-- Video List (كىنو تىزىملىكى - بۇ يەرگە ئۆزىڭىز كىنو قوشالايسىز) -->
        <div class="video-grid">
            
            <!-- كىنو 1 -->
            <div class="video-card" onclick="playMovie('https://www.youtube.com/embed/9bZkp7q19f0', 'يېڭى چىققان تەۋسىيە كىنو 1', 'بۇ كىنوخانىدىكى تۇنجى كىنو بولۇپ، ئالاھىدە مەزمۇنلار بىلەن تەمىنلەيدۇ.')">
                <div class="thumbnail-box">
                    <img src="https://i.ibb.co/zVJv5yCR/pubg.jpg" alt="Movie 1">
                </div>
                <div class="video-info">
                    <div class="video-title">يېڭى چىققان تەۋسىيە كىنو 1</div>
                    <div class="video-meta">
                        <span>1.2مىڭ كۆرۈلدى</span>
                        <span>•</span>
                        <span>2 كۈن ئ ilgiri</span>
                    </div>
                </div>
            </div>

            <!-- كىنو 2 -->
            <div class="video-card" onclick="playMovie('https://www.youtube.com/embed/LXb3EKWsInQ', 'قىزىقەرلىك ھەرىكەتلىك كىنو 2', 'بۇ كىنو ئويۇن ۋە ھەرىكەت سەھنىلىرىگە تولغان بولۇپ، كۆرۈشكە ئەرزىيدۇ.')">
                <div class="thumbnail-box">
                    <img src="https://i.ibb.co/Xf3dg16D/mlbb.jpg" alt="Movie 2">
                </div>
                <div class="video-info">
                    <div class="video-title">قىزىقەرلىك ھەرىكەتلىك كىنو 2</div>
                    <div class="video-meta">
                        <span>3.5مىڭ كۆرۈلدى</span>
                        <span>•</span>
                        <span>1 ھەپتە ئىلگىرى</span>
                    </div>
                </div>
            </div>

            <!-- كىنو 3 -->
            <div class="video-card" onclick="playMovie('https://www.youtube.com/embed/5qap5aO4i9A', 'تەۋەككۈلچىلىك دراما كىنوسى 3', 'مەزكۇر دراما كىنوسىدا قىزىق ۋە تەسىرلىك ۋەقەلەر بايان قىلىنىدۇ.')">
                <div class="thumbnail-box">
                    <img src="https://i.ibb.co/5gRdRdM2/hok.jpg" alt="Movie 3">
                </div>
                <div class="video-info">
                    <div class="video-title">تەۋەككۈلچىلىك دراما كىنوسى 3</div>
                    <div class="video-meta">
                        <span>800 كۆرۈلدى</span>
                        <span>•</span>
                        <span>3 كۈن ئىلگىرى</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- === كىنو كۆرۈش بېتى (Player View) === -->
    <div id="player-view" class="view">
        <div class="player-section">
            <button class="back-btn" onclick="goHome()">← ئارقىغا قايتىش</button>
            <div class="player-container">
                <iframe id="movie-player" src="" allowfullscreen></iframe>
            </div>
            <div id="movie-title" class="current-video-title">كىنو تېمىسى</div>
            <div id="movie-desc" class="current-video-desc">كىنو توغرىسدىكى قىسقىچە بايان بۇ يەردە كۆرسىتىلىدۇ.</div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="goHome()">
            <span>🏠</span>
            باش بەت
        </a>
        <a class="nav-item" onclick="alert('تىزلا ئېچىلىدۇ!')">
            <span>🔥</span>
            قىزىق
        </a>
        <a class="nav-item" onclick="alert('تىزلا ئېچىلىدۇ!')">
            <span>📚</span>
            تىزىملىك
        </a>
        <a class="nav-item" onclick="alert('تىزلا ئېچىلىدۇ!')">
            <span>👤</span>
            ھېسابات
        </a>
    </div>

</div>

<script>
    function playMovie(videoUrl, title, description) {
        document.getElementById('home-view').classList.remove('active');
        document.getElementById('player-view').classList.add('active');
        
        document.getElementById('movie-player').src = videoUrl;
        document.getElementById('movie-title').innerText = title;
        document.getElementById('movie-desc').innerText = description;
        
        window.scrollTo(0,0);
    }

    function goHome() {
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('home-view').classList.add('active');
        
        // سىن قويۇشنى توختىتىش ئۈچۈن iframe نىڭ src نى قۇرۇق قىلىمىز
        document.getElementById('movie-player').src = '';
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
